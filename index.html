<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#041a11">
    <title>المنصة الرقمية لمدرسة المُرُوج </title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@300;500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="splash-placeholder"></div>

    <div class="ministry-bar">
        <span>سلطنة عُمَان</span>
        <span>وزارة التربية والتعليم</span>
        <span>محافظة ظفار</span>
    </div>
    
    <header class="app-header">
        <div class="logo-box">
            <img src="https://raw.githubusercontent.com/faissaltunisia/student-grades/main/Screenshot%202025-12-16%20235912.png">
            <div class="brand-text">
                <h1> التلاوة و الحفظ </h1>
                <span id="grade-display" style="color:#fff; opacity:0.7; font-size:0.8rem;">تحميل...</span>
            </div>
        </div>
        <button onclick="openModal('modal-grades')" style="background:var(--gold-gradient); border:none; padding:8px 15px; border-radius:10px; font-weight:900; cursor:pointer; font-size:0.75rem;">تبديل الصف</button>
    </header>

    <main class="main-scroller">
        <div class="challenge-banner">
            <div>
                <small style="color:var(--accent)">تحدي اليوم ⚡</small>
                <h2 id="challenge-title">...</h2>
            </div>
            <button onclick="startChallenge()" style="background:var(--gold-gradient); border:none; padding:12px 25px; border-radius:12px; font-weight:900; cursor:pointer;">ابدأ 🚀</button>
        </div>

        <div class="sem-box">
            <button id="sem1" class="sem-btn active" onclick="switchSem(1)">الفصل الدراسي الأول</button>
            <button id="sem2" class="sem-btn" onclick="switchSem(2)">الفصل الدراسي الثاني</button>
        </div>
        <div id="surah-grid" class="surah-grid"></div>
    </main>

    <div id="player-modal" class="player-modal">
        <div class="cinema-box">
            <div class="player-header">
                <h2 id="video-title" style="color:var(--accent); font-family:'Amiri'; font-size:1.5rem; margin:0;">اسم السورة</h2>
                <button onclick="closePlayer()" class="close-player-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="video-box" class="video-container"></div>
            <div id="progress-hud">
                <div style="display:flex; justify-content:space-between; margin-bottom:10px; color:#fff; font-size:0.9rem;">
                    <span>إنجاز التحدي</span>
                    <span id="pct-text">0%</span>
                </div>
                <div style="width:100%; height:10px; background:rgba(255,255,255,0.1); border-radius:10px; overflow:hidden; border: 1px solid var(--accent);">
                    <div id="fill-bar" style="width:0%; height:100%; background:var(--gold-gradient); transition:0.3s;"></div>
                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="location.reload()">
            <i class="fa-solid fa-house"></i>
            <span>الرئيسية</span>
        </button>
        <button class="nav-item" onclick="openModal('modal-grades')">
            <i class="fa-solid fa-book"></i>
            <span>الصفوف</span>
        </button>
        <button class="nav-item" onclick="openPrize()">
            <div id="prize-notif" class="badge-count"></div>
            <i class="fa-solid fa-trophy"></i>
            <span>الجائزة</span>
        </button>
        <button class="nav-item" onclick="openModal('modal-about')">
            <i class="fa-solid fa-circle-info"></i>
            <span>عن المنصة</span>
        </button>
    </nav>

    <div id="modal-grades" class="modal"><div class="modal-card">
        <h2 style="color:var(--accent); margin-bottom:20px; font-family:'Amiri'; font-size:1.8rem;">قائمة الصفوف</h2>
        <div id="grades-list" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; max-height:60vh; overflow-y:auto;"></div>
        <button onclick="closeModal('modal-grades')" style="margin-top:20px; color:var(--accent); background:none; border:none; font-weight:bold; cursor:pointer;">إغلاق</button>
    </div></div>

    <div id="modal-about" class="modal"><div class="modal-card">
        <h2 style="color:var(--accent); font-family:'Amiri';">المنصة الرقمية لمدرسة المُرُوج</h2>
        <p style="margin:20px 0; line-height:1.6;">منصة تعليمية رقمية تابعة لمدرسة المروج للتعليم الأساسي بمحافظة ظفار. تهدف المنصة إلى تسخير التقنيات الحديثة لخدمة القرآن الكريم.</p>
        <button class="grade-btn" onclick="closeModal('modal-about')">شكراً لكم</button>
    </div></div>

    <div id="modal-prize" class="modal"><div class="modal-card" id="prize-content"></div></div>

    <script src="script.js"></script>
</body>
</html>

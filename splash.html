<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرحباً بكم في منصة المروج</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@500&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #041a11; --accent: #c4a04d; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle, #06311f 0%, #041a11 100%); overflow: hidden; font-family: 'Tajawal', sans-serif; }
        .splash-container { text-align: center; animation: fadeIn 1.5s ease-in-out; }
        .ministry-title { color: #fff; margin-bottom: 30px; animation: slideDown 1s forwards 0.5s; opacity: 0; }
        .ministry-title h2 { font-family: 'Amiri', serif; font-size: 1.2rem; margin: 0; }
        .logo-wrapper { width: 150px; height: 150px; margin: 0 auto 25px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #fff); padding: 5px; animation: pulse 2s infinite; }
        .logo-wrapper img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: white; }
        .school-name { color: var(--accent); font-family: 'Amiri', serif; font-size: 2rem; margin-bottom: 10px; animation: fadeInUp 1s forwards 0.8s; opacity: 0; }
        .region-name { color: #fff; font-size: 0.9rem; opacity: 0.7; animation: fadeInUp 1s forwards 1s; opacity: 0; }
        .loader { margin-top: 40px; width: 40px; height: 40px; border: 3px solid rgba(196,160,77,0.2); border-top: 3px solid var(--accent); border-radius: 50%; display: inline-block; animation: spin 1s linear infinite; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeInUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="ministry-title"><h2>سلطنة عُمان</h2><h2>وزارة التربية والتعليم</h2></div>
        <div class="logo-wrapper"><img src="https://raw.githubusercontent.com/faissaltunisia/student-grades/main/Screenshot%202025-12-16%20235912.png"></div>
        <div class="school-name">مدرسة المُرُوج (5-8)</div>
        <div class="region-name">محافظة ظفار | المديرية العامة للتربية والتعليم</div>
        <div><span class="loader"></span></div>
    </div>
    <script>
        sessionStorage.setItem('splashed', 'true');
        setTimeout(() => {
            document.body.style.transition = "opacity 0.5s";
            document.body.style.opacity = "0";
            setTimeout(() => { window.location.href = 'index.html'; }, 500);
        }, 3000);
    </script>
</body>
</html>
